<form class="lead-form js-form">
  <p class="label-form-subtitle">Безкоштовно</p>
  <h3 class="form-title">Отримати кошторис на ваш ремонт</h3>
  <p class="form-text">Залиште ім'я і телефон — зв'яжемось протягом години в робочий час і обговоримо проєкт.
  </p>
  <ul class="lead-form-list">
    <li class="lead-form-item"><svg class="lead-form-list-icon" width="20" height="20">
        <use href="/sprite.svg#icon-check"></use>
      </svg>
      <p class="form-list-text">Безкоштовний виїзд на замір</p>
    </li>
    <li class="lead-form-item"><svg class="lead-form-list-icon" width="20" height="20">
        <use href="/sprite.svg#icon-check"></use>
      </svg>
      <p class="form-list-text">Без зобов'язань</p>
    </li>
  </ul>
  <div class="lead-fields">
    <div class="form-field">
      <label class="form-field-label">Ваше ім'я
        <input class="form-field-input" type="text" name="username" placeholder="Наприклад, Олена"
          autocomplete="given-name">
      </label>

      <p class="field-error" data-error="username" aria-live="polite"></p>
    </div>
    <div class="form-field">
      <label class="form-field-label">Телефон
        <input class="form-field-input" type="tel" name="phone" placeholder="+380 XX XXX XX XX" autocomplete="tel">
      </label>

      <p class="field-error" aria-live="polite" data-error="phone">
      </p>
    </div>

  </div>


  <button class="form-btn" type="submit">
    <p>Отримати кошторис</p>
    <svg class="form-icon-arrow" width="20" height="20" aria-hidden="true">
      <use href="/sprite.svg#icon-arrow"></use>
    </svg>
  </button>
  <p class="form-note">Натискаючи кнопку, ви погоджуєтесь на <a href="#" target="_blank"
      rel="noopener noreferrer">обробку персональних даних</a></p>
</form>

<section class="reviews-section" id="reviews">
  <div class="container">
    <p class="reviews-subtitle">Наші клієнти</p>
    <h2 class="reviews-title">Реальні відгуки</h2>
  </div>

  <div class="reviews-swiper swiper">
    <ul class="reviews-list swiper-wrapper" id="reviews-list" aria-busy="true">
      <li class="reviews-item swiper-slide reviews-skeleton" aria-hidden="true">
        <div class="reviews-shot"></div>
        <p class="reviews-author">
          <span class="reviews-skeleton-line"></span>
          <span class="reviews-skeleton-line reviews-object"></span>
        </p>
      </li>
      <li class="reviews-item swiper-slide reviews-skeleton" aria-hidden="true">
        <div class="reviews-shot"></div>
        <p class="reviews-author">
          <span class="reviews-skeleton-line"></span>
          <span class="reviews-skeleton-line reviews-object"></span>
        </p>
      </li>
      <li class="reviews-item swiper-slide reviews-skeleton" aria-hidden="true">
        <div class="reviews-shot"></div>
        <p class="reviews-author">
          <span class="reviews-skeleton-line"></span>
          <span class="reviews-skeleton-line reviews-object"></span>
        </p>
      </li>
    </ul>
  </div>

  <div class="reviews-controls">
    <button class="reviews-btn reviews-prev" type="button" aria-label="Попередній відгук">
      <svg class="reviews-btn-icon" width="18" height="18" aria-hidden="true">
        <use href="./sprite.svg#icon-arrow"></use>
      </svg>
    </button>

    <div class="reviews-pagination">
      <span class="reviews-dot" aria-hidden="true"></span>
      <span class="reviews-dot reviews-dot-active" aria-hidden="true"></span>
      <span class="reviews-dot" aria-hidden="true"></span>
    </div>

    <button class="reviews-btn reviews-next" type="button" aria-label="Наступний відгук">
      <svg class="reviews-btn-icon" width="18" height="18" aria-hidden="true">
        <use href="./sprite.svg#icon-arrow"></use>
      </svg>
    </button>
  </div>
</section>

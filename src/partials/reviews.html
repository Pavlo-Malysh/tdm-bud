<section class="reviews-section" id="reviews">
  <div class="container">
    <p class="reviews-subtitle">Наші клієнти</p>
    <h2 class="reviews-title">Реальні відгуки</h2>
  </div>

  <div class="reviews-swiper swiper">
    <ul class="reviews-list swiper-wrapper">
      <li class="reviews-item swiper-slide">
        <div class="reviews-shot">
          <img class="reviews-img" src="/img/reviews/review-1.jpg"
            alt="Відгук клієнта про ремонт комерційного приміщення" width="576" height="478" loading="lazy">
        </div>
        <p class="reviews-author">Саша<span class="reviews-object">комерційне приміщення</span></p>
      </li>

      <li class="reviews-item swiper-slide">
        <div class="reviews-shot">
          <img class="reviews-img" src="/img/reviews/review-2.jpg" alt="Відгук клієнта про ремонт квартири під ключ"
            width="576" height="350" loading="lazy">
        </div>
        <p class="reviews-author">Владислав<span class="reviews-object">квартира під здачу</span></p>
      </li>

      <li class="reviews-item swiper-slide">
        <div class="reviews-shot">
          <img class="reviews-img" src="/img/reviews/review-3.jpg"
            alt="Відгук клієнтки про ремонт трикімнатної квартири" width="576" height="495" loading="lazy">
        </div>
        <p class="reviews-author">Марія<span class="reviews-object">3-кімнатна квартира</span></p>
      </li>
    </ul>
  </div>

  <div class="reviews-controls">
    <button class="reviews-btn reviews-prev" type="button" aria-label="Попередній відгук">
      <svg class="reviews-btn-icon" width="18" height="18" aria-hidden="true">
        <use href="./sprite.svg#icon-arrow"></use>
      </svg>
    </button>

    <div class="reviews-pagination"></div>

    <button class="reviews-btn reviews-next" type="button" aria-label="Наступний відгук">
      <svg class="reviews-btn-icon" width="18" height="18" aria-hidden="true">
        <use href="./sprite.svg#icon-arrow"></use>
      </svg>
    </button>
  </div>
</section>
